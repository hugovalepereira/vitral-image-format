name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned so that new clippy lints in later releases do not break CI
      # unannounced; bump deliberately.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - name: Build WebAssembly
        run: cargo build -p vitral-wasm --profile wasm --target wasm32-unknown-unknown

  # The polyfill must match the reference compositor in all three engines.
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release -p vitral-cli
      - run: ./web/build.sh
      - name: WebAssembly (32-bit) decoder robustness
        run: node web/test/wasm32.mjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node web/test/run.mjs
        env:
          VITRAL_BROWSERS: chromium,firefox,webkit
      - name: Demo page (own files, encoder)
        run: node web/test/demo.mjs
        env:
          VITRAL_BROWSERS: chromium,firefox,webkit
      # The committed ui.html must come from the current UI source; the test
      # then runs on a fresh build, which is also what the artifact holds.
      - name: Figma plugin
        run: |
          ./figma/build.sh --check
          ./figma/build.sh
          node figma/test/plugin.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: vitral-figma-plugin
          path: |
            figma/manifest.json
            figma/code.js
            figma/ui.html
