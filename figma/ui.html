<!doctype html>
<!--
  Source of the plugin's UI. build.sh inlines the WebAssembly module and its
  bindings into ui.html, because Figma loads the UI as a single HTML string.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: var(--figma-color-bg, #fff);
    --bg-2: var(--figma-color-bg-secondary, #f5f5f5);
    --text: var(--figma-color-text, #1e1e1e);
    --text-2: var(--figma-color-text-secondary, #6b6b6b);
    --border: var(--figma-color-border, #e6e6e6);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --on-brand: var(--figma-color-text-onbrand, #fff);
    --warn: var(--figma-color-text-warning, #b86200);
    --danger: var(--figma-color-text-danger, #dc3412);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 11px/16px Inter, system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  section { padding: 12px; display: grid; gap: 10px; }
  section + section { border-top: 1px solid var(--border); }
  h2 { margin: 0; font-size: 11px; font-weight: 600; }
  p { margin: 0; }
  .muted { color: var(--text-2); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .row[hidden] { display: none; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
  .seg button {
    font: inherit; color: var(--text); background: none; border: 0;
    padding: 3px 9px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--bg-2); font-weight: 600; }
  .primary, .secondary {
    font: inherit; font-weight: 600; border-radius: 5px; padding: 8px 12px; cursor: pointer;
  }
  .primary { color: var(--on-brand); background: var(--brand); border: 0; }
  .secondary { color: var(--text); background: none; border: 1px solid var(--border); padding: 4px 10px; }
  .primary:disabled { opacity: .4; cursor: default; }
  ul.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  ul.notes:empty { display: none; }
  ul.notes li { padding-left: 14px; position: relative; }
  ul.notes li::before {
    content: ""; position: absolute; left: 2px; top: 6px; width: 5px; height: 5px;
    border-radius: 50%; background: var(--text-2);
  }
  ul.notes li.warn::before { background: var(--warn); }
  ul.notes li.error { color: var(--danger); }
  ul.notes li.error::before { background: var(--danger); }
  .candidates { display: grid; gap: 6px; }
  .candidates:empty { display: none; }
  .candidate { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .drop {
    display: grid; place-items: center; text-align: center; min-height: 64px; padding: 10px;
    border: 1px dashed var(--text-2); border-radius: 6px; cursor: pointer;
  }
  .drop.over { border-color: var(--brand); background: var(--bg-2); }
  .previews { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .previews[hidden] { display: none; }
  figure { margin: 0; display: grid; gap: 4px; }
  figcaption { color: var(--text-2); }
  /* The backdrop the preview blends with: black, paper, then colour. The
     artwork must not sit in a stacking context of its own (no transform,
     opacity or z-index between it and .stage), or it would not blend. */
  .stage {
    height: 112px; border-radius: 4px; overflow: hidden;
    display: grid; place-items: center; padding: 8px;
    background:
      linear-gradient(90deg, #111 0 22%, #f3efe6 22% 44%, transparent 44%),
      linear-gradient(160deg, #e4572e 0%, #f3a712 30%, #29335c 65%, #669bbc 100%);
  }
  .art { position: relative; line-height: 0; }
  .art canvas { display: block; }
  .art canvas + canvas { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<section id="export-section">
  <h2>Export</h2>
  <p id="selection" class="muted">Select a layer or frame to export.</p>
  <div class="row">
    <span>Scale</span>
    <div class="seg" id="export-scale">
      <button data-value="1" aria-pressed="true">1x</button><button data-value="2" aria-pressed="false">2x</button><button data-value="3" aria-pressed="false">3x</button><button data-value="4" aria-pressed="false">4x</button>
    </div>
  </div>
  <div class="row" id="together-row" hidden>
    <span>Layers</span>
    <div class="seg" id="together">
      <button data-value="separate" aria-pressed="true">One file each</button><button data-value="together" aria-pressed="false">One file</button>
    </div>
  </div>
  <ul class="notes" id="export-notes"></ul>
  <button class="primary" id="export" disabled>Export .vitral.png</button>
  <div class="previews" id="result" hidden>
    <figure><div class="stage"><div class="art" id="preview-png"></div></div><figcaption>Plain PNG</figcaption></figure>
    <figure><div class="stage"><div class="art" id="preview-vitral"></div></div><figcaption>Vitral</figcaption></figure>
  </div>
  <ul class="notes" id="result-notes"></ul>
</section>

<section id="import-section">
  <h2>Import</h2>
  <div class="candidates" id="candidates"></div>
  <label class="drop" id="drop">
    <input type="file" id="file" accept=".png,image/png" multiple hidden>
    <span>Drop a <b>.vitral.png</b> here, or click to choose<br><span class="muted">While this panel is open, files dragged onto the canvas are rebuilt too.</span></span>
  </label>
  <div class="row">
    <span>File scale</span>
    <div class="seg" id="import-scale">
      <button data-value="1" aria-pressed="true">1x</button><button data-value="2" aria-pressed="false">2x</button><button data-value="3" aria-pressed="false">3x</button><button data-value="4" aria-pressed="false">4x</button>
    </div>
  </div>
  <ul class="notes" id="import-notes"></ul>
</section>

const $ = (id) => document.getElementById(id);
const toPlugin = (msg) => parent.postMessage({ pluginMessage: msg }, '*');
const state = { items: [], colourSpace: 'srgb', target: { name: null, filled: false } };

let wasmReady;
function vitral() {
  if (!wasmReady) {
    const binary = atob(WASM_BASE64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    wasmReady = wasm_bindgen({ module_or_path: bytes }).then(() => wasm_bindgen);
  }
  return wasmReady;
}

// --- small helpers -------------------------------------------------------

function segmented(id) {
  const seg = $(id);
  const set = (value) => {
    for (const b of seg.querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.value === String(value)));
  };
  seg.addEventListener('click', (e) => { if (e.target.dataset.value) set(e.target.dataset.value); });
  return { set, get: () => seg.querySelector('[aria-pressed="true"]').dataset.value };
}
const exportScale = segmented('export-scale');
const together = segmented('together');
const importScale = segmented('import-scale');

function notes(id, list) {
  $(id).replaceChildren(...list.map(([kind, html]) => {
    const li = document.createElement('li');
    li.className = kind;
    li.innerHTML = html;
    return li;
  }));
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const q = (name) => `“${esc(name)}”`;
const spaceName = (space) => (space === 'display-p3' ? 'Display P3' : 'sRGB');

function fileName(name, scale) {
  const safe = name.replace(/[\\/:*?"<>|]+/g, '-').trim() || 'vitral';
  return `${safe}${scale > 1 ? `@${scale}x` : ''}.vitral.png`;
}

function download(bytes, name, type) {
  const url = URL.createObjectURL(new Blob([bytes], { type }));
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

// A ZIP archive without compression (PNG data is already compressed), so
// several files leave the plugin as one download.
const CRC_TABLE = Array.from({ length: 256 }, (_, n) => {
  let c = n;
  for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
  return c >>> 0;
});
function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}
function zip(files) {
  const enc = new TextEncoder();
  const parts = [];
  const central = [];
  let offset = 0;
  for (const { name, bytes } of files) {
    const nameBytes = enc.encode(name);
    const crc = crc32(bytes);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);
    local.setUint16(6, 0x0800, true); // UTF-8 names
    local.setUint32(14, crc, true);
    local.setUint32(18, bytes.length, true);
    local.setUint32(22, bytes.length, true);
    local.setUint16(26, nameBytes.length, true);
    const entry = new DataView(new ArrayBuffer(46));
    entry.setUint32(0, 0x02014b50, true);
    entry.setUint16(4, 20, true);
    entry.setUint16(6, 20, true);
    entry.setUint16(8, 0x0800, true);
    entry.setUint32(16, crc, true);
    entry.setUint32(20, bytes.length, true);
    entry.setUint32(24, bytes.length, true);
    entry.setUint16(28, nameBytes.length, true);
    entry.setUint32(42, offset, true);
    parts.push(new Uint8Array(local.buffer), nameBytes, bytes);
    central.push(new Uint8Array(entry.buffer), nameBytes);
    offset += 30 + nameBytes.length + bytes.length;
  }
  const size = central.reduce((n, p) => n + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, size, true);
  end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)]);
}

function canvasFrom(rgba, width, height, mode) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(rgba), width, height), 0, 0);
  if (mode) canvas.style.mixBlendMode = mode;
  return canvas;
}

// --- export ----------------------------------------------------------------

function selectionNotes() {
  const items = state.items;
  const list = [];
  const usable = items.filter((it) => !it.problem);
  if (items.length === 0) {
    $('selection').textContent = 'Select a layer or frame to export.';
  } else if (items.length === 1) {
    const it = items[0];
    $('selection').innerHTML = `${q(it.name)} <span class="muted">· ${it.width} × ${it.height}</span>`;
  } else {
    $('selection').textContent = `${items.length} layers selected.`;
  }
  $('together-row').hidden = usable.length < 2;
  for (const it of items) {
    const who = items.length > 1 ? `${q(it.name)}: ` : '';
    if (it.problem) { list.push(['warn', who + esc(it.problem)]); continue; }
    const r = it.report;
    if (r.reaching === 0) {
      list.push(['', `${who}No blend modes reach the background, so this will behave like a regular PNG.`]);
    }
    if (r.filled) {
      list.push(['warn', `${who}${q(it.name)} has a fill, so the blend modes inside mix with that fill rather than with what is behind. Hide the fill to let them through.`]);
    }
    for (const g of r.isolated) {
      list.push(['warn', `${who}${q(g.name)} is set to ${esc(g.mode)}, not Pass through, so the blend modes inside it only mix within it.`]);
    }
    for (const m of r.approximate) {
      list.push(['warn', `${who}${esc(m.mode)} on ${q(m.name)} is exact over black and white only; over other colours it is approximated, and can be off by several levels.`]);
    }
    for (const m of r.lost) {
      list.push(['warn', `${who}${esc(m.mode)} on ${q(m.name)} can’t be kept by Vitral 0.1; it will only be right over black and white.`]);
    }
    for (const b of r.backgroundBlur) {
      list.push(['warn', `${who}The background blur on ${q(b.name)} won’t blur what is behind the file.`]);
    }
    if (r.truncated) list.push(['', `${who}Large selection: only part of it was checked for blend modes.`]);
  }
  notes('export-notes', list);
  $('export').disabled = usable.length === 0;
}

let pending = 0;
const exported = [];
const errors = [];

$('export').addEventListener('click', () => {
  $('export').disabled = true;
  pending = 0;
  exported.length = 0;
  errors.length = 0;
  notes('result-notes', [['', 'Rendering…']]);
  toPlugin({ type: 'export', scale: Number(exportScale.get()), together: together.get() === 'together' });
});

function preview(planes) {
  const { width, height } = planes;
  $('result').hidden = false;
  // Fit inside the stage, minus its padding.
  const fit = Math.min(1, 96 / height, ($('preview-vitral').parentElement.clientWidth - 16) / width);
  const size = (c) => { c.style.width = `${width * fit}px`; c.style.height = `${height * fit}px`; return c; };
  $('preview-png').replaceChildren(size(canvasFrom(planes.native(), width, height)));
  $('preview-vitral').replaceChildren(
    size(canvasFrom(planes.difference(), width, height, 'difference')),
    size(canvasFrom(planes.screen(), width, height, 'screen')),
    size(canvasFrom(planes.multiply(), width, height, 'multiply')),
  );
}

async function encodeRenders(msg) {
  const lib = await vitral();
  const file = lib.encodeFromExports(msg.black, msg.white, msg.transparent);
  const planes = lib.decodePlanes(file);
  try {
    const k = planes.overBlack(), w = planes.overWhite();
    let opaque = true;
    for (let i = 0; i < k.length && opaque; i++) opaque = k[i] === w[i];
    let name = fileName(msg.name, msg.scale);
    for (let n = 2; exported.some((e) => e.name === name); n++) name = fileName(`${msg.name} ${n}`, msg.scale);
    exported.push({ name, bytes: file, space: planes.colourSpace, opaque });
    preview(planes);
  } finally {
    planes.free();
  }
}

// One download per export, whatever the number of files: browsers block a
// second download that no click started.
function exportDone() {
  const list = [];
  if (exported.length === 1) {
    const e = exported[0];
    download(e.bytes, e.name, 'image/png');
    list.push(['', `Saved <b>${esc(e.name)}</b> (${spaceName(e.space)}, ${Math.ceil(e.bytes.length / 1024)} KB).`]);
  } else if (exported.length > 1) {
    download(zip(exported), 'Vitral export.zip', 'application/zip');
    list.push(['', `Saved ${exported.length} files in <b>Vitral export.zip</b> (${spaceName(exported[0].space)}).`]);
  }
  if (exported.some((e) => e.opaque)) {
    list.push(['warn', 'A result is opaque, so it looks the same as a regular PNG over any background.']);
  }
  notes('result-notes', list.concat(errors.map((m) => ['error', esc(m)])));
  $('export').disabled = !state.items.some((it) => !it.problem);
}

// --- import ----------------------------------------------------------------

function importNotes(extra = []) {
  const t = state.target;
  const list = [];
  if (!t.filled) {
    list.push(['warn', t.name
      ? `Imports go inside ${q(t.name)}, which has no fill. The layers need a filled background behind them to show the file’s colours.`
      : 'Imports go to the middle of the screen; select a frame to put them inside it. The layers need a filled background behind them.']);
  } else {
    list.push(['', `Imports go inside ${q(t.name)}.`]);
  }
  if (state.colourSpace === 'display-p3') list.push(['', 'The layers are made in Display P3, the document’s colour profile.']);
  notes('import-notes', list.concat(extra));
}

// Decodes a file and asks the plugin to place it. `id` names a placement the
// plugin is waiting for (a file dropped on the canvas, an image to rebuild).
async function decodeAndPlace(bytes, name, scale, id) {
  const lib = await vitral();
  const layers = lib.decodeLayerPngs(bytes, state.colourSpace);
  try {
    const base = { type: 'place', id, name, width: layers.width, height: layers.height, scale };
    if (id === null && (base.width > 4096 || base.height > 4096)) {
      importNotes([['error', `${q(name)} is ${base.width} × ${base.height} px; Figma takes images up to 4096 px a side.`]]);
      return;
    }
    if (layers.status !== 'ok') {
      importNotes([['warn', `${q(name)} is not a Vitral file (${esc(layers.status)}); placed as a plain image.`]]);
      toPlugin({ ...base, plain: bytes });
      return;
    }
    importNotes();
    toPlugin({
      ...base,
      difference: layers.usesDifference ? layers.difference() : null,
      screen: layers.screen(),
      multiply: layers.multiply(),
    });
  } finally {
    layers.free();
  }
}

async function importFile(file) {
  const match = /@(\d)x/i.exec(file.name);
  if (match && Number(match[1]) <= 4) importScale.set(match[1]);
  const name = file.name.replace(/(@\dx)?(\.vitral)?\.png$/i, '') || 'Vitral';
  try {
    await decodeAndPlace(new Uint8Array(await file.arrayBuffer()), name, Number(importScale.get()), null);
  } catch (e) {
    importNotes([['error', `Couldn’t read ${q(file.name)}: ${esc(e.message || e)}`]]);
  }
}

async function importFiles(files) {
  for (const file of files) await importFile(file);
}

$('file').addEventListener('change', () => {
  importFiles([...$('file').files]);
  $('file').value = '';
});
const drop = $('drop');
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', (e) => {
  e.preventDefault();
  drop.classList.remove('over');
  importFiles([...e.dataTransfer.files]);
});

function showCandidates(items) {
  $('candidates').replaceChildren(...items.map((item) => {
    const row = document.createElement('div');
    row.className = 'candidate';
    row.innerHTML = `<span>${q(item.name)} is a Vitral placed as a flat image.</span>`;
    const button = document.createElement('button');
    button.className = 'secondary';
    button.textContent = 'Rebuild';
    button.addEventListener('click', () => toPlugin({ type: 'rebuild', key: item.key }));
    row.append(button);
    return row;
  }));
}

// --- messages from the plugin ---------------------------------------------

window.onmessage = async (event) => {
  const msg = event.data && event.data.pluginMessage;
  if (!msg) return;
  if (msg.type === 'selection') {
    Object.assign(state, { items: msg.items, colourSpace: msg.colourSpace, target: msg.target });
    selectionNotes();
    importNotes();
  } else if (msg.type === 'candidates') {
    showCandidates(msg.items);
  } else if (msg.type === 'decode') {
    try {
      await decodeAndPlace(msg.bytes, msg.name, msg.scale, msg.id);
    } catch (e) {
      importNotes([['error', `Couldn’t read ${q(msg.name)}: ${esc(e.message || e)}`]]);
    }
  } else if (msg.type === 'export-start') {
    pending = msg.count;
  } else if (msg.type === 'renders') {
    try {
      await encodeRenders(msg);
    } catch (e) {
      errors.push(`“${msg.name}”: ${e.message || e}`);
    }
    if (--pending <= 0) exportDone();
  } else if (msg.type === 'error' && msg.context === 'import') {
    importNotes([['error', esc(msg.message)]]);
  } else if (msg.type === 'error') {
    errors.push(msg.message);
    if (pending > 0) pending--;
    if (pending <= 0) exportDone();
  }
};

toPlugin({ type: 'ready' });
vitral(); // start compiling the module while the designer looks at the panel
</script>
</body>
</html>
