[workspace]
resolver = "2"
members = ["crates/vitral", "crates/vitral-cli", "crates/vitral-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/hugovalepereira/vitral-image-format"
authors = ["Hugo Vale Pereira"]

# Small, fast WebAssembly builds: cargo build --profile wasm --target wasm32-unknown-unknown
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
