[package]
name = "vitral-cli"
description = "Command-line tool to create, inspect and render Vitral images"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "vitral"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
vitral = { version = "0.1.0", path = "../vitral" }
